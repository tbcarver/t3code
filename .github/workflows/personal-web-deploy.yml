name: Personal web deploy

# Builds this fork's web app and publishes it to the S3 bucket behind
# t3.sabiamia.com (infra/t3-web). Manual, like the personal desktop build.
# AWS access is a GitHub OIDC role scoped to that bucket and distribution, so the
# repo holds no AWS keys. Repo variables: WEB_DEPLOY_ROLE_ARN, WEB_BUCKET,
# WEB_DISTRIBUTION_ID, WEB_URL.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: personal-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # Public sign-in and relay config (T3 Connect), same as the desktop build.
      - name: Copy public build config
        run: cp .env.example .env

      - name: Build web app
        env:
          VITE_HOSTED_APP_URL: ${{ vars.WEB_URL }}
          VITE_HOSTED_APP_CHANNEL: nightly
        run: vp run --filter @t3tools/web build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.WEB_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets are immutable; index.html and the manifest must revalidate.
      - name: Upload to S3
        run: |
          aws s3 sync apps/web/dist "s3://${{ vars.WEB_BUCKET }}" --delete \
            --exclude "index.html" --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws s3 cp apps/web/dist/manifest.webmanifest "s3://${{ vars.WEB_BUCKET }}/manifest.webmanifest" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.WEB_DISTRIBUTION_ID }}" --paths "/*"
