name: Personal desktop build

# Manual build of the Windows and Linux desktop installers for this fork.
# Not the production release pipeline (see release-desktop.yml) — this is a
# simplified build using the local branch as-is, without code signing or
# relay tracing config, following docs/t3-code-windows-build.md and the
# personal Linux build doc.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The Windows desktop build embeds a Linux CLI archive as its WSL backend
  # (apps/desktop's WSL support runs that archive inside the distro). Without
  # it, `dist:desktop:win:x64` still succeeds but silently omits WSL support.
  linux-cli-archive:
    name: Build Linux CLI archive (for Windows WSL support)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Enable corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # apps/server/scripts/cli.ts build-exe shells out to `vp pack`.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false

      - name: Install Linux desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Copy public build config
        run: cp .env.example .env

      - name: Install dependencies
        run: corepack pnpm install

      - name: Resolve archive version
        id: version
        run: echo "version=$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_OUTPUT"

      # Needs a Node that supports --build-sea (25.7+); VP_NODE_VERSION tells
      # vp to download and use that Node for this step only, independent of
      # the repo's pinned engines.node.
      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ steps.version.outputs.version }}" \
            --output-dir release-cli

      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  build:
    needs: linux-cli-archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            script: dist:desktop:win:x64
            rust_target: x86_64-pc-windows-msvc
            artifact_glob: release/*.exe
          - label: linux-x64
            os: ubuntu-latest
            script: dist:desktop:linux
            rust_target: x86_64-unknown-linux-gnu
            artifact_glob: release/*.AppImage
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Enable corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Copy public build config
        shell: bash
        run: cp .env.example .env

      - name: Install dependencies
        run: corepack pnpm install

      - name: Download Linux CLI archive for WSL
        if: matrix.label == 'windows-x64'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build desktop installer
        shell: bash
        env:
          T3CODE_DESKTOP_WSL_RUNTIME: ${{ matrix.label == 'windows-x64' && format('wsl-runtime/t3-{0}-linux-x64.tar.gz', needs.linux-cli-archive.outputs.version) || '' }}
        run: corepack pnpm ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t3code-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
